name: Add motion and sound polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-motion-sound.yml
      - tools/upgrade_motion_sound.py

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bundler
        run: npm install --no-save --no-package-lock esbuild@0.25.9
      - name: Apply motion and sound upgrade
        run: python3 tools/upgrade_motion_sound.py
      - name: Commit upgraded standalone game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/app.js tests/ui.spec.mjs
          git commit -m "Add card animations, sound effects and hand clearance"
          git push
