name: Upgrade resume and motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-resume-motion.yml
      - tools/upgrade_resume_motion.py

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - run: npx esbuild --version
      - run: python3 tools/upgrade_resume_motion.py
      - run: node --check src/app.js
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js index.html tests/ui.spec.mjs
          git commit -m "Add persistent continue flow and clearer card motion"
          git push
