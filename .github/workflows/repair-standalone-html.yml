name: Repair standalone HTML

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-standalone-html.yml

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle frontend JavaScript
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.9
          npx esbuild src/app.js --bundle --format=iife --target=es2020 --minify --outfile=/tmp/rummy500-bundle.js
      - name: Replace only the inline app block
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          let js = fs.readFileSync('/tmp/rummy500-bundle.js', 'utf8');
          js = js.replace(/<\/script/gi, '<\\/script');
          const marker = /<script id="rummy500-app">[\s\S]*?<\/script>/;
          if (!marker.test(html)) throw new Error('Inline app marker not found');
          html = html.replace(marker, `<script id="rummy500-app">\n${js}\n</script>`);
          if (/src\/app\.js/.test(html)) throw new Error('External app reference remains in standalone HTML');
          if (!/<style id="rummy500-styles">/.test(html)) throw new Error('Inline CSS marker missing');
          fs.writeFileSync(path, html);
          NODE
      - name: Commit repaired standalone HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regenerate standalone HTML bundle"
          git push
